<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FannyFa Exploit - Base64 Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --gray: #777;
      --light: #e9e9e9;
      --border: #d5d5d5;
      --term-green: #0f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--white);
      color: var(--black);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.035),
        rgba(0, 0, 0, 0.035) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 99;
    }

    .page {
      width: 100%;
      max-width: 520px;
      z-index: 1;
    }

    .card {
      background-color: var(--white);
      border: 2px solid var(--black);
      box-shadow: 12px 12px 0 var(--light);
      padding: 28px 24px;
      position: relative;
    }

    .card-header-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gray);
      text-transform: uppercase;
      border-bottom: 1px solid var(--black);
      padding-bottom: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header-tag .status {
      color: var(--black);
      background: var(--light);
      padding: 2px 6px;
      border: 1px solid var(--black);
    }

    .card h2 {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -1px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2::before {
      content: ">";
      color: var(--black);
      font-weight: 800;
    }

    .input-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--gray);
      letter-spacing: 0.5px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      background-color: var(--white);
      border: 1.5px solid var(--black);
      color: var(--black);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      resize: vertical;
      transition: all 0.15s ease;
      border-radius: 0;
    }

    textarea:focus {
      background-color: #fafafa;
      box-shadow: 4px 4px 0 var(--black);
      transform: translate(-2px, -2px);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      padding: 14px;
      background-color: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background-color: var(--black);
      color: var(--white);
      box-shadow: 4px 4px 0 var(--light);
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    button.btn-secondary {
      background-color: var(--light);
    }

    .msg {
      margin-top: 20px;
      padding: 12px;
      background-color: var(--black);
      color: var(--term-green);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      border: 1px solid var(--black);
      min-height: 42px;
      word-break: break-all;
      display: none;
      line-height: 1.4;
    }

    .msg:not(:empty) {
      display: block;
    }

    .msg::before {
      content: "[SYS_LOG]: ";
      color: var(--white);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div id="base64page" class="page">
    <div class="card">
      <div class="card-header-tag">
        <span>UTILITY // BASE64_CONVERTER</span>
        <span class="status">[READY]</span>
      </div>

      <h2>Base64 Tool</h2>
      
      <div class="input-group">
        <label class="input-label" for="inputText">// INPUT DATA</label>
        <textarea id="inputText" placeholder="Masukkan teks atau string Base64..." required></textarea>
      </div>

      <div class="button-group">
        <button id="btnEncode" onclick="processBase64('encode')">
          <i class="bi bi-lock-fill"></i> ENCODE
        </button>
        <button id="btnDecode" onclick="processBase64('decode')">
          <i class="bi bi-unlock-fill"></i> DECODE
        </button>
      </div>

      <div class="input-group" style="margin-top: 16px;">
        <label class="input-label" for="outputText">// OUTPUT RESULT</label>
        <textarea id="outputText" placeholder="Hasil konversi akan tampil di sini..." readonly></textarea>
      </div>

      <button id="btnCopy" class="btn-secondary" onclick="copyOutput()">
        <i class="bi bi-clipboard-fill"></i> COPY RESULT
      </button>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    function processBase64(mode) {
      const input = document.getElementById('inputText').value;
      const output = document.getElementById('outputText');
      const msg = document.getElementById('msg');
      
      if (!input) {
        msg.innerText = "Error: Input string tidak boleh kosong.";
        output.value = "";
        return;
      }

      try {
        if (mode === 'encode') {
          output.value = btoa(input);
          msg.innerText = "String berhasil di-encode ke Base64.";
        } else if (mode === 'decode') {
          output.value = atob(input);
          msg.innerText = "Base64 berhasil di-decode ke teks biasa.";
        }
      } catch (err) {
        output.value = "";
        msg.innerText = "Error: Format Base64 tidak valid untuk di-decode.";
      }
    }

    function copyOutput() {
      const output = document.getElementById('outputText');
      const msg = document.getElementById('msg');

      if (!output.value) {
        msg.innerText = "Error: Tidak ada hasil untuk disalin.";
        return;
      }

      navigator.clipboard.writeText(output.value).then(() => {
        msg.innerText = "Hasil berhasil disalin ke clipboard.";
      }).catch(() => {
        msg.innerText = "Error: Gagal menyalin teks.";
      });
    }
  </script>

</body>
</html>
