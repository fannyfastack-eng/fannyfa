<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Terminal — FannyFa</title>

<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
  rel="stylesheet"
>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/black-metal.min.css"
>
<link rel="stylesheet" href="css/ai-chat.css">
</head>
<body>

<!-- =========================
     NAVBAR
========================= -->
<header class="navbar">

  <div class="logo">
    <div class="logo-box">FF</div>
    <span class="logo-text">AI TERMINAL</span>
  </div>

  <div class="nav-actions">

    <button class="icon-btn fx-btn" id="btnNewChat" title="Chat baru" aria-label="Chat baru">
      <i class="bi bi-plus-lg"></i>
    </button>

    <button class="icon-btn fx-btn" id="btnHistory" title="Riwayat sesi" aria-label="Riwayat">
      <i class="bi bi-clock-history"></i>
    </button>

    <button class="icon-btn fx-btn" id="btnSettings" title="Pengaturan" aria-label="Pengaturan">
      <i class="bi bi-gear"></i>
    </button>

  </div>

</header>

<!-- =========================
     HISTORY / SESSIONS PANEL
========================= -->
<aside class="side-panel" id="historyPanel">
  <div class="side-panel-head">
    <span>// RIWAYAT SESI</span>
    <button class="icon-btn fx-btn small" id="closeHistory" aria-label="Tutup">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="side-panel-actions">
    <button class="ghost-btn fx-btn" id="btnDeleteAll">
      <i class="bi bi-trash3"></i>
      Hapus semua pesan
    </button>
  </div>

  <div class="session-list" id="sessionList">
    <!-- session items injected by chat.js -->
  </div>
</aside>
<div class="overlay-dim" id="overlayDim"></div>

<!-- =========================
     SETTINGS MODAL
========================= -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">

    <div class="modal-head">
      <span><i class="bi bi-sliders"></i> PENGATURAN AI</span>
      <button class="icon-btn fx-btn small" id="closeSettings" aria-label="Tutup">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="modal-body" id="settingsBody">

      <div class="settings-label">// API KEY PER PROVIDER</div>

      <div class="provider-field" data-provider="gemini">
        <label><i class="bi bi-stars"></i> Gemini</label>
        <div class="key-input-row">
          <input type="password" placeholder="Masukkan API key Gemini..." class="key-input">
          <button class="icon-btn fx-btn small toggle-eye" aria-label="Lihat"><i class="bi bi-eye"></i></button>
        </div>
      </div>

      <div class="provider-field" data-provider="groq">
        <label><i class="bi bi-lightning-charge"></i> Groq</label>
        <div class="key-input-row">
          <input type="password" placeholder="Masukkan API key Groq..." class="key-input">
          <button class="icon-btn fx-btn small toggle-eye" aria-label="Lihat"><i class="bi bi-eye"></i></button>
        </div>
      </div>

      <div class="provider-field" data-provider="openai">
        <label><i class="bi bi-chat-dots"></i> ChatGPT (OpenAI)</label>
        <div class="key-input-row">
          <input type="password" placeholder="Masukkan API key OpenAI..." class="key-input">
          <button class="icon-btn fx-btn small toggle-eye" aria-label="Lihat"><i class="bi bi-eye"></i></button>
        </div>
      </div>

      <div class="provider-field" data-provider="deepseek">
        <label><i class="bi bi-search"></i> DeepSeek</label>
        <div class="key-input-row">
          <input type="password" placeholder="Masukkan API key DeepSeek..." class="key-input">
          <button class="icon-btn fx-btn small toggle-eye" aria-label="Lihat"><i class="bi bi-eye"></i></button>
        </div>
      </div>

      <div class="provider-field" data-provider="qwen">
        <label><i class="bi bi-yin-yang"></i> Qwen</label>
        <div class="key-input-row">
          <input type="password" placeholder="Masukkan API key Qwen..." class="key-input">
          <button class="icon-btn fx-btn small toggle-eye" aria-label="Lihat"><i class="bi bi-eye"></i></button>
        </div>
      </div>

      <button class="primary-btn fx-btn" id="btnSaveKeys">
        <i class="bi bi-check2"></i> Simpan Pengaturan
      </button>

      <div class="msg" id="settingsMsg"></div>

    </div>

  </div>
</div>

<!-- =========================
     MAIN CHAT
========================= -->
<main class="chat-wrap">

  <!-- WELCOME / HERO -->
  <section class="welcome" id="welcomeSection">
    <div class="welcome-grid"></div>
    <div class="welcome-icon">
      <i class="bi bi-terminal"></i>
    </div>
    <div class="greeting" id="greetingText">Selamat Datang</div>
    <div class="greeting-sub" id="greetingSub">FannyFa AI Terminal siap membantu</div>
    <div class="welcome-tags">
      <span><i class="bi bi-cpu"></i> Multi-model</span>
      <span><i class="bi bi-paperclip"></i> Upload file</span>
      <span><i class="bi bi-code-slash"></i> Live preview</span>
    </div>
  </section>

  <!-- MESSAGES -->
  <section class="messages" id="messages"></section>

  <!-- ATTACH PREVIEW CHIPS -->
  <div class="attach-preview" id="attachPreview"></div>

  <!-- INPUT BAR -->
  <div class="input-bar">

    <div class="model-select-wrap">
      <button class="model-btn fx-btn" id="modelBtn">
        <i class="bi bi-stars"></i>
        <span id="modelBtnLabel">Gemini · flash</span>
        <i class="bi bi-chevron-down tiny-chevron"></i>
      </button>

      <div class="model-dropdown" id="modelDropdown"></div>
    </div>

    <div class="attach-wrap">
      <button class="icon-btn fx-btn" id="attachBtn" aria-label="Lampirkan">
        <i class="bi bi-paperclip"></i>
      </button>
      <div class="attach-menu" id="attachMenu">
        <button class="attach-option fx-btn" data-accept="image/*">
          <i class="bi bi-image"></i> Gambar
        </button>
        <button class="attach-option fx-btn" data-accept=".txt,.js,.py,.json,.html,.css,.md">
          <i class="bi bi-file-earmark-code"></i> File
        </button>
        <button class="attach-option fx-btn" data-accept=".pdf,.doc,.docx,.xlsx,.csv">
          <i class="bi bi-file-earmark-text"></i> Dokumen
        </button>
      </div>
      <input type="file" id="fileInput" hidden multiple>
    </div>

    <textarea id="chatInput" rows="1" placeholder="Ketik pesan..."></textarea>

    <button class="send-btn fx-btn" id="sendBtn" aria-label="Kirim">
      <i class="bi bi-send"></i>
    </button>

  </div>

</main>

<canvas id="fxCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="js/settingai.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
