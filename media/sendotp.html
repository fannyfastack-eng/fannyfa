<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FannyFa Exploit - Kirim OTP</title>
  
  <!-- Google Fonts: JetBrains Mono & Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* CSS Variables WAJIB */
    :root {
      --black: #000;
      --white: #fff;
      --gray: #777;
      --light: #e9e9e9;
      --border: #d5d5d5;
      --term-green: #0f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--white);
      color: var(--black);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Noise / Grain Overlay Line Pattern */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.035),
        rgba(0, 0, 0, 0.035) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 99;
    }

    /* Page Container */
    .page {
      width: 100%;
      max-width: 440px;
      z-index: 1;
    }

    /* Terminal Card Box */
    .card {
      background-color: var(--white);
      border: 2px solid var(--black);
      box-shadow: 12px 12px 0 var(--light);
      padding: 28px 24px;
      position: relative;
    }

    /* Header Tag Hacker Style */
    .card-header-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gray);
      text-transform: uppercase;
      border-bottom: 1px solid var(--black);
      padding-bottom: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header-tag .status {
      color: var(--black);
      background: var(--light);
      padding: 2px 6px;
      border: 1px solid var(--black);
    }

    /* Title */
    .card h2 {
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -1px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2::before {
      content: ">";
      color: var(--black);
      font-weight: 800;
    }

    /* Form Fields */
    .input-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--gray);
      letter-spacing: 0.5px;
    }

    input[type="email"],
    input[type="number"] {
      width: 100%;
      padding: 12px;
      background-color: var(--white);
      border: 1.5px solid var(--black);
      color: var(--black);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: all 0.15s ease;
      border-radius: 0; /* Sharp corner */
    }

    input[type="email"]:focus,
    input[type="number"]:focus {
      background-color: #fafafa;
      box-shadow: 4px 4px 0 var(--black);
      transform: translate(-2px, -2px);
    }

    input::placeholder {
      color: #aaa;
      font-size: 12px;
    }

    /* Button */
    button#btnKirimOTP {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background-color: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    /* Hover Invert Effect */
    button#btnKirimOTP:hover {
      background-color: var(--black);
      color: var(--white);
      box-shadow: 4px 4px 0 var(--light);
    }

    button#btnKirimOTP:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    /* Terminal Output / Message Box */
    .msg {
      margin-top: 20px;
      padding: 12px;
      background-color: var(--black);
      color: var(--term-green);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      border: 1px solid var(--black);
      min-height: 42px;
      word-break: break-all;
      display: none; /* Otomatis muncul jika ada isi via JS */
      line-height: 1.4;
    }

    /* Tampilkan box pesan saat JS mengisi kontennya */
    .msg:not(:empty) {
      display: block;
    }

    .msg::before {
      content: "[SYS_LOG]: ";
      color: var(--white);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div id="sendotppage" class="page">
    <div class="card">
      <div class="card-header-tag">
        <span>UTILITY // EXECUTE_OTP</span>
        <span class="status">[READY]</span>
      </div>

      <h2>Kirim OTP</h2>
      
      <div class="input-group">
        <label class="input-label" for="email">// TARGET EMAIL</label>
        <input type="email" id="email" placeholder="Masukkan email..." required autocomplete="off">
      </div>

      <div class="input-group">
        <label class="input-label" for="number">// AMOUNT / PAYLOAD</label>
        <input type="number" id="number" placeholder="Masukkan jumlah..." required>
      </div>

      <button id="btnKirimOTP" onclick="kirimOTP()">
        <i class="bi bi-terminal-fill"></i> EXECUTE_DISPATCH
      </button>

      <div class="msg" id="msg"></div>
    </div>
  </div>
<script>
      function showMsg(el, text, color) {
  el.innerHTML = text;
  el.style.color = color;
      }
    async function kirimOTP() {
  const emailInput = document.getElementById('email');
  const numberInput = document.getElementById('number');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnKirimOTP');

  const email = emailInput.value.trim();
  const number = numberInput.value.trim();

  // Validasi email
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    showMsg(msg, "❌ Email tidak valid", "red");
    emailInput.focus();
    return;
  }

  // Validasi nomor HP
  const numberRegex = /^[0-9]+$/;
  if (!numberRegex.test(number)) {
    showMsg(msg, "❌ Nomor HP tidak valid", "red");
    numberInput.focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = "⏳ Mengirim...";
  showMsg(msg, "⏳ Mengirim OTP...", "white");

  try {
    const res = await fetch('http://localhost:3000/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, number })
    });

    const data = await res.json();

    if (res.ok && data.success) {
      showMsg(msg, "✅ OTP berhasil dikirim! Cek email Anda.", "lightgreen");
      emailInput.value = "";
      numberInput.value = "";
    } else {
      showMsg(msg, `❌ ${data.message || "Gagal mengirim OTP"}`, "red");
    }

  } catch (err) {
    showMsg(msg, "❌ Tidak dapat terhubung ke server", "red");
    console.error("OTP Error:", err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Kirim OTP";
  }
  }
    </script>
</body>
</html>
