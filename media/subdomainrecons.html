<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FannyFa Exploit - Subdomain Recon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --gray: #777;
      --light: #e9e9e9;
      --border: #d5d5d5;
      --term-green: #0f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--white);
      color: var(--black);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.035),
        rgba(0, 0, 0, 0.035) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 99;
    }

    .page {
      width: 100%;
      max-width: 500px;
      z-index: 1;
    }

    .card {
      background-color: var(--white);
      border: 2px solid var(--black);
      box-shadow: 12px 12px 0 var(--light);
      padding: 28px 24px;
      position: relative;
    }

    .card-header-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gray);
      text-transform: uppercase;
      border-bottom: 1px solid var(--black);
      padding-bottom: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header-tag .status {
      color: var(--black);
      background: var(--light);
      padding: 2px 6px;
      border: 1px solid var(--black);
    }

    .card h2 {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -1px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2::before {
      content: ">";
      color: var(--black);
      font-weight: 800;
    }

    .input-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--gray);
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      background-color: var(--white);
      border: 1.5px solid var(--black);
      color: var(--black);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: all 0.15s ease;
      border-radius: 0;
    }

    input[type="text"]:focus {
      background-color: #fafafa;
      box-shadow: 4px 4px 0 var(--black);
      transform: translate(-2px, -2px);
    }

    input::placeholder {
      color: #aaa;
      font-size: 12px;
    }

    button#btnScan {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background-color: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button#btnScan:hover {
      background-color: var(--black);
      color: var(--white);
      box-shadow: 4px 4px 0 var(--light);
    }

    button#btnScan:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .msg {
      margin-top: 20px;
      padding: 12px;
      background-color: var(--black);
      color: var(--term-green);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      border: 1px solid var(--black);
      min-height: 80px;
      max-height: 200px;
      overflow-y: auto;
      word-break: break-all;
      display: none;
      line-height: 1.4;
    }

    .msg:not(:empty) {
      display: block;
    }

    .msg::before {
      content: "[SYS_OUTPUT]: ";
      color: var(--white);
      opacity: 0.6;
      display: block;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div id="subdomainpage" class="page">
    <div class="card">
      <div class="card-header-tag">
        <span>RECON // SUBDOMAIN_SCANNER</span>
        <span class="status">[READY]</span>
      </div>

      <h2>Subdomain Recon</h2>
      
      <div class="input-group">
        <label class="input-label" for="targetDomain">// TARGET DOMAIN</label>
        <input type="text" id="targetDomain" placeholder="example.com" required autocomplete="off">
      </div>

      <button id="btnScan" onclick="runScan()">
        <i class="bi bi-diagram-3-fill"></i> START_DISCOVERY
      </button>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    function runScan() {
      const domain = document.getElementById('targetDomain').value;
      const msgDiv = document.getElementById('msg');
      if (!domain) {
        msgDiv.innerText = "Error: Input domain required.";
        return;
      }
      msgDiv.innerText = "Initiating scan for: " + domain + "...";
    }
  </script>

</body>
</html>
